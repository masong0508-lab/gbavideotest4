name: Build GBA ROMs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: ls -la build && for f in build/*.gba; do test $(stat -c %s $f) -le 33554432 || { echo "$f exceeds 32 MiB"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: film-roms
          path: build/*.gba
